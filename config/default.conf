# GLBP engine configuration
#
# lines starting with # or ; are comments, format is key=value

# OpenGL context version to request from the platform.
# "desired" is attempted first; if a context/window with that version can't
# be created, the engine falls back to "required" (the minimum acceptable
# version) before giving up entirely.
gl_version_desired_major=4
gl_version_desired_minor=6
gl_version_required_major=3
gl_version_required_minor=3
